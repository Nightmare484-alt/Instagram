workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Setup Flutter project
        script: |
          flutter create --project-name insta_mock --org com.example --platforms android temp_project
          cp -r temp_project/android ./android
          cp -r temp_project/.metadata ./.metadata 2>/dev/null || true
          cp -r temp_project/analysis_options.yaml ./analysis_options.yaml 2>/dev/null || true
          rm -rf temp_project
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
